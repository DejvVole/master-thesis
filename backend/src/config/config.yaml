# Model settings
models:
  gpt_llm: "gpt-4o-mini"
  groq_llm: "llama-3.1-8b-instant"
  mistral_llm: "mistral-small-latest"
  embedding: "text-embedding-3-small"
  evaluator_llm: "gpt-4o-mini"

# Storage settings
storage:
  docs_dir: "data/source-docs/"
  chroma_db: "chroma_database"
  collection_name: "ConstructionData"
  processed_registry: "data/processed_docs/processed_files.json"

# MinIO settings
minio:
  buckets:
    raw_pdfs: "raw-pdfs"
    exports: "rag-exports"

  upload:
    max_file_size: 104857600 # 100MB
    allowed_extensions: [".pdf", ".doc", ".docx"]

# Chunking settings
chunking:
  sentence_splitter:
    chunk_size: 256
    chunk_overlap: 64
  semantic_splitter:
    buffer_size: 1
    percentile_threshold: 95

# Retrieval settings
retrieval:
  similarity_top_k: 15
  rerank_top_n: 6

# Ingestion settings
ingestion:
  title_extractor_nodes: 5
  qa_extractor_questions: 3

# Evaluation settings
evaluation:
  categories_file: "data/categories/categories.json"
  test_categories_file: "data/categories/test_categories.json"
  output_dir: "data/llm-outputs/"
  nodes_output_file: "data/retrieved-nodes/nodes.txt"

feature_flags:
  save_to_database: true
  enable_metrics: false
  use_test_categories: false
  use_stored_nodes: false

missing_value_indicators:
  - "NIE JE"
  - "NIE JE!"
  - ""
  - "NIE JE."
  - "None"
  - "Empty Response"
  - "EMPTY RESPONSE"
