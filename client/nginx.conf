server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Max upload size (pre dokumenty)
    client_max_body_size 100M;

    # Proxy /api requesty na Express server
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / long-running requesty (RAG pipeline moze trvat dlhsie)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback — vsetky routes presmeruj na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache staticke assety (JS, CSS, obrazky)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
