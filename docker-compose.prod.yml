services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: building-rag-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Nie je exponovany port navonok — pristupny len cez docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: building-rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # MinIO konzola volitelne na localhost (pre administraciu)
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: building-rag-server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PYTHON_BIN: /opt/venv/bin/python
      BACKEND_DIR: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Nie je exponovany port navonok — nginx v client kontajneri proxy-uje
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.prod
      args:
        # URL cez ktoru klient pristupuje na API (rovnaka domena, /api prefix)
        VITE_API_URL: ""
    container_name: building-rag-client
    depends_on:
      - server
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
